<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 仪表盘</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex">
  <!-- 侧边栏 -->
  <aside class="w-64 bg-gray-900 text-white min-h-screen flex-shrink-0 hidden md:block">
    <div class="p-6 border-b border-gray-700">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🐾</span>
        <div>
          <h1 class="font-bold text-lg">宠物助手后台</h1>
          <p class="text-gray-400 text-xs" id="admin-name">管理员</p>
        </div>
      </div>
    </div>
    <nav class="p-4 space-y-1">
      <a href="#" onclick="switchTab('products')" id="nav-products"
        class="flex items-center gap-3 px-4 py-3 rounded-lg bg-purple-600 transition">
        <i class="fa fa-cube w-5"></i> 商品管理
      </a>
      <a href="#" onclick="switchTab('orders')" id="nav-orders"
        class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-800 transition">
        <i class="fa fa-list-alt w-5"></i> 订单管理
      </a>
      <a href="#" onclick="switchTab('stats')" id="nav-stats"
        class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-800 transition">
        <i class="fa fa-bar-chart w-5"></i> 数据概览
      </a>
      <div class="pt-4 mt-4 border-t border-gray-700">
        <a href="../index.html" target="_blank"
          class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-800 transition text-gray-400">
          <i class="fa fa-external-link w-5"></i> 打开前台网站
        </a>
        <a href="#" onclick="logout()"
          class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-red-900 transition text-red-400">
          <i class="fa fa-sign-out w-5"></i> 退出登录
        </a>
      </div>
    </nav>
  </aside>

  <!-- 移动端导航 -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 bg-gray-900 text-white z-50 flex">
    <button onclick="switchTab('products')" class="flex-1 py-3 text-center text-sm nav-mobile active">
      <i class="fa fa-cube block text-lg"></i>商品
    </button>
    <button onclick="switchTab('orders')" class="flex-1 py-3 text-center text-sm nav-mobile">
      <i class="fa fa-list-alt block text-lg"></i>订单
    </button>
    <button onclick="switchTab('stats')" class="flex-1 py-3 text-center text-sm nav-mobile">
      <i class="fa fa-bar-chart block text-lg"></i>概览
    </button>
    <button onclick="logout()" class="flex-1 py-3 text-center text-sm nav-mobile text-red-400">
      <i class="fa fa-sign-out block text-lg"></i>退出
    </button>
  </div>

  <!-- 主内容区 -->
  <main class="flex-1 p-4 md:p-8 mb-16 md:mb-0 overflow-auto">
    <!-- 商品管理 -->
    <div id="tab-products" class="tab-content">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
        <h2 class="text-2xl font-bold text-gray-800">
          <i class="fa fa-cube mr-2 text-purple-600"></i>商品管理
        </h2>
        <button onclick="openProductModal()"
          class="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-lg transition font-medium">
          <i class="fa fa-plus mr-1"></i> 添加商品
        </button>
      </div>

      <!-- 商品搜索 -->
      <div class="bg-white rounded-xl p-4 mb-6 shadow-sm flex gap-3 flex-wrap">
        <input type="text" id="product-search" oninput="renderProductList()"
          placeholder="搜索商品名称..." class="flex-1 min-w-[200px] px-4 py-2 border rounded-lg outline-none focus:border-purple-500">
        <select id="product-category" onchange="renderProductList()"
          class="px-4 py-2 border rounded-lg outline-none">
          <option value="">全部分类</option>
          <option value="food">宠物食品</option>
          <option value="health">健康护理</option>
          <option value="toy">玩具用品</option>
          <option value="home">家居用品</option>
        </select>
      </div>

      <!-- 商品列表 -->
      <div class="bg-white rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">商品</th>
                <th class="px-4 py-3 text-left text-sm font-medium text-gray-600 hidden md:table-cell">分类</th>
                <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">价格</th>
                <th class="px-4 py-3 text-left text-sm font-medium text-gray-600 hidden lg:table-cell">销量</th>
                <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">操作</th>
              </tr>
            </thead>
            <tbody id="product-table-body" class="divide-y divide-gray-100">
            </tbody>
          </table>
        </div>
        <div id="product-empty" class="hidden text-center py-12 text-gray-400">
          <i class="fa fa-inbox text-4xl block mb-3"></i>暂无商品
        </div>
      </div>
    </div>

    <!-- 订单管理 -->
    <div id="tab-orders" class="tab-content hidden">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">
        <i class="fa fa-list-alt mr-2 text-purple-600"></i>订单管理
      </h2>
      <div class="bg-white rounded-xl shadow-sm p-6 text-center text-gray-400">
        <i class="fa fa-info-circle text-5xl block mb-4"></i>
        <p class="text-lg font-medium text-gray-600 mb-2">Demo 模式说明</p>
        <p class="max-w-md mx-auto">订单数据存储在 Vercel 实例内存中，不同函数实例间数据不互通。生产环境建议接入 Vercel KV 或数据库实现持久化存储。</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm overflow-hidden mt-6">
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">订单号</th>
                <th class="px-4 py-3 text-left text-sm font-medium text-gray-600 hidden md:table-cell">时间</th>
                <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">金额</th>
                <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">状态</th>
              </tr>
            </thead>
            <tbody id="order-table-body" class="divide-y divide-gray-100">
            </tbody>
          </table>
        </div>
        <div id="order-empty" class="text-center py-12 text-gray-400">
          <i class="fa fa-inbox text-4xl block mb-3"></i>暂无订单
        </div>
      </div>
    </div>

    <!-- 数据概览 -->
    <div id="tab-stats" class="tab-content hidden">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">
        <i class="fa fa-bar-chart mr-2 text-purple-600"></i>数据概览
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-sm p-6">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-gray-500 text-sm">商品总数</p>
              <p class="text-3xl font-bold text-gray-800" id="stat-products">0</p>
            </div>
            <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center text-2xl">📦</div>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-6">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-gray-500 text-sm">订单总数</p>
              <p class="text-3xl font-bold text-gray-800" id="stat-orders">0</p>
            </div>
            <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center text-2xl">📋</div>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-6">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-gray-500 text-sm">当前模式</p>
              <p class="text-xl font-bold text-orange-600">Demo</p>
            </div>
            <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center text-2xl">🔧</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 商品编辑弹窗 -->
  <div id="product-modal" class="hidden fixed inset-0 z-50">
    <div class="absolute inset-0 bg-black/50" onclick="closeProductModal()"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6">
      <h3 class="text-xl font-bold mb-5" id="modal-title">添加商品</h3>
      <form id="product-form" class="space-y-4">
        <input type="hidden" id="prod-id">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">商品名称 *</label>
          <input type="text" id="prod-name" required class="w-full px-3 py-2 border rounded-lg outline-none focus:border-purple-500">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">分类 *</label>
            <select id="prod-category" required class="w-full px-3 py-2 border rounded-lg outline-none">
              <option value="food">宠物食品</option>
              <option value="health">健康护理</option>
              <option value="toy">玩具用品</option>
              <option value="home">家居用品</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">适用宠物</label>
            <select id="prod-petType" class="w-full px-3 py-2 border rounded-lg outline-none">
              <option value="both">通用</option>
              <option value="dog">狗狗</option>
              <option value="cat">猫咪</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">售价 *</label>
            <input type="number" id="prod-price" required min="1" step="0.01" class="w-full px-3 py-2 border rounded-lg outline-none focus:border-purple-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">原价</label>
            <input type="number" id="prod-originalPrice" min="1" step="0.01" class="w-full px-3 py-2 border rounded-lg outline-none">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
          <input type="text" id="prod-desc" class="w-full px-3 py-2 border rounded-lg outline-none focus:border-purple-500">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">图标 (emoji)</label>
            <input type="text" id="prod-img" placeholder="📦" class="w-full px-3 py-2 border rounded-lg outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">标签 (逗号分隔)</label>
            <input type="text" id="prod-tags" placeholder="进口, 天然" class="w-full px-3 py-2 border rounded-lg outline-none">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">角标</label>
          <input type="text" id="prod-badge" placeholder="热销 / 推荐 / 爆款" class="w-full px-3 py-2 border rounded-lg outline-none">
        </div>
        <div class="flex gap-3 pt-3">
          <button type="submit"
            class="flex-1 py-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-medium transition">
            <i class="fa fa-check mr-1"></i> 保存
          </button>
          <button type="button" onclick="closeProductModal()"
            class="flex-1 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg font-medium transition">
            取消
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API = '/api/admin';
    let token, products = [];

    // 初始化
    async function init() {
      token = localStorage.getItem('admin_token');
      if (!token) { window.location.href = 'index.html'; return; }

      document.getElementById('admin-name').textContent = localStorage.getItem('admin_user') || '管理员';
      await loadProducts();
      await loadStats();
      switchTab('products');
    }

    // 加载商品
    async function loadProducts() {
      try {
        const res = await fetch(`${API}/products`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) { logout(); return; }
        const data = await res.json();
        if (data.success) {
          products = data.data.products || [];
        }
      } catch (e) { console.error('加载商品失败:', e); }
      renderProductList();
    }

    // 渲染商品列表
    function renderProductList() {
      const search = (document.getElementById('product-search')?.value || '').toLowerCase();
      const cat = document.getElementById('product-category')?.value || '';

      let filtered = products;
      if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search));
      if (cat) filtered = filtered.filter(p => p.category === cat);

      const tbody = document.getElementById('product-table-body');
      const empty = document.getElementById('product-empty');

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        tbody.innerHTML = filtered.map(p => `
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-3">
              <div class="flex items-center gap-3">
                <span class="text-2xl">${p.img}</span>
                <div>
                  <p class="font-medium text-gray-800">${p.name}</p>
                  <p class="text-xs text-gray-400 hidden md:block">${p.desc}</p>
                </div>
                ${p.badge ? `<span class="ml-2 px-2 py-0.5 bg-red-100 text-red-600 rounded-full text-xs">${p.badge}</span>` : ''}
              </div>
            </td>
            <td class="px-4 py-3 text-gray-600 hidden md:table-cell">${catLabel(p.category)}</td>
            <td class="px-4 py-3">
              <span class="font-bold text-red-500">¥${p.price}</span>
              ${p.originalPrice > p.price ? `<span class="text-gray-400 line-through text-xs ml-1">¥${p.originalPrice}</span>` : ''}
            </td>
            <td class="px-4 py-3 text-gray-600 hidden lg:table-cell">${p.sales}</td>
            <td class="px-4 py-3">
              <button onclick="editProduct(${p.id})" class="text-blue-600 hover:text-blue-800 mr-3" title="编辑">
                <i class="fa fa-edit"></i>
              </button>
              <button onclick="deleteProduct(${p.id})" class="text-red-500 hover:text-red-700" title="删除">
                <i class="fa fa-trash"></i>
              </button>
            </td>
          </tr>
        `).join('');
      }
    }

    function catLabel(c) {
      const map = { food: '宠物食品', health: '健康护理', toy: '玩具用品', home: '家居用品' };
      return map[c] || c;
    }

    // 打开商品弹窗
    function openProductModal(product) {
      document.getElementById('prod-id').value = product?.id || '';
      document.getElementById('prod-name').value = product?.name || '';
      document.getElementById('prod-category').value = product?.category || 'food';
      document.getElementById('prod-petType').value = product?.petType || 'both';
      document.getElementById('prod-price').value = product?.price || '';
      document.getElementById('prod-originalPrice').value = product?.originalPrice || '';
      document.getElementById('prod-desc').value = product?.desc || '';
      document.getElementById('prod-img').value = product?.img || '';
      document.getElementById('prod-tags').value = product?.tags?.join(', ') || '';
      document.getElementById('prod-badge').value = product?.badge || '';
      document.getElementById('modal-title').textContent = product ? '编辑商品' : '添加商品';
      document.getElementById('product-modal').classList.remove('hidden');
    }

    function closeProductModal() {
      document.getElementById('product-modal').classList.add('hidden');
    }

    function editProduct(id) {
      const p = products.find(x => x.id === id);
      if (p) openProductModal(p);
    }

    async function deleteProduct(id) {
      if (!confirm('确定要删除该商品吗？')) return;
      try {
        const res = await fetch(`${API}/products/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
          products = products.filter(p => p.id !== id);
          renderProductList();
          showToast('商品已删除');
        }
      } catch (e) { showToast('删除失败', 'error'); }
    }

    // 提交商品表单
    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('prod-id').value;
      const body = {
        name: document.getElementById('prod-name').value.trim(),
        category: document.getElementById('prod-category').value,
        petType: document.getElementById('prod-petType').value,
        price: parseFloat(document.getElementById('prod-price').value),
        originalPrice: parseFloat(document.getElementById('prod-originalPrice').value) || null,
        desc: document.getElementById('prod-desc').value.trim(),
        img: document.getElementById('prod-img').value || '📦',
        tags: document.getElementById('prod-tags').value.split(',').map(t => t.trim()).filter(Boolean),
        badge: document.getElementById('prod-badge').value.trim()
      };

      try {
        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API}/products/${id}` : `${API}/products`;
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          if (id) {
            const idx = products.findIndex(p => p.id === parseInt(id));
            if (idx !== -1) products[idx] = data.data;
          } else {
            products.push(data.data);
          }
          renderProductList();
          closeProductModal();
          showToast(id ? '商品已更新' : '商品已添加');
        } else {
          showToast(data.error || '操作失败', 'error');
        }
      } catch (e) { showToast('操作失败', 'error'); }
    });

    // 加载统计
    async function loadStats() {
      document.getElementById('stat-products').textContent = products.length;
      try {
        const res = await fetch(`${API}/orders`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('stat-orders').textContent = data.data.total || 0;
          renderOrderList(data.data.orders || []);
        }
      } catch (e) {}
    }

    function renderOrderList(orders) {
      const tbody = document.getElementById('order-table-body');
      const empty = document.getElementById('order-empty');
      if (!orders || orders.length === 0) {
        tbody.innerHTML = '';
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        tbody.innerHTML = orders.map(o => `
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-3 font-mono text-sm text-gray-800">${o.orderNo}</td>
            <td class="px-4 py-3 text-gray-600 hidden md:table-cell">${o.createdAt ? new Date(o.createdAt).toLocaleString('zh-CN') : '-'}</td>
            <td class="px-4 py-3 font-bold text-red-500">¥${o.total?.toFixed(2) || '0.00'}</td>
            <td class="px-4 py-3">
              <span class="px-2 py-1 rounded-full text-xs font-medium ${o.status === 'paid' ? 'bg-green-100 text-green-700' : o.status === 'pending' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-600'}">
                ${o.status === 'paid' ? '已支付' : o.status === 'pending' ? '待支付' : o.status || '-'}
              </span>
            </td>
          </tr>
        `).join('');
      }
    }

    // 切换面板
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.querySelectorAll('aside nav a').forEach(a => a.classList.remove('bg-purple-600'));
      document.getElementById(`nav-${tab}`)?.classList.add('bg-purple-600');
      if (tab === 'stats') loadStats();
      if (tab === 'orders') loadStats();
    }

    function logout() {
      localStorage.removeItem('admin_token');
      localStorage.removeItem('admin_user');
      window.location.href = 'index.html';
    }

    function showToast(msg, type) {
      const existing = document.querySelector('.toast-msg');
      if (existing) existing.remove();
      const t = document.createElement('div');
      t.className = 'toast-msg';
      t.textContent = msg;
      t.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:${type==='error'?'#f44336':'#333'};color:white;padding:12px 28px;border-radius:24px;font-size:14px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.2);`;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    init();
  </script>
</body>
</html>
