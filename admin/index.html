<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 宠物新手助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
  </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">🐾</div>
      <h1 class="text-2xl font-bold text-gray-800">宠物新手助手</h1>
      <p class="text-gray-500 mt-1">管理后台</p>
    </div>

    <form id="login-form" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          <i class="fa fa-user mr-1"></i>用户名
        </label>
        <input type="text" id="username" required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
          placeholder="请输入用户名" autocomplete="username">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          <i class="fa fa-lock mr-1"></i>密码
        </label>
        <input type="password" id="password" required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
          placeholder="请输入密码" autocomplete="current-password">
      </div>
      <div id="error-msg" class="text-red-500 text-sm hidden">
        <i class="fa fa-exclamation-circle"></i> <span></span>
      </div>
      <button type="submit"
        class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-medium rounded-lg transition duration-200 text-lg">
        <i class="fa fa-sign-in mr-2"></i>登录
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-400">
      <p>默认帐号：admin / admin123</p>
      <p class="mt-1">可在 Vercel 环境变量中修改</p>
    </div>
  </div>

  <script>
    // 检查是否已登录
    const token = localStorage.getItem('admin_token');
    if (token) {
      // 验证 token 是否有效
      fetch('/api/admin/products', {
        headers: { 'Authorization': `Bearer ${token}` }
      }).then(res => {
        if (res.ok) window.location.href = 'dashboard.html';
      });
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error-msg');
      const errorSpan = errorEl.querySelector('span');
      const btn = e.target.querySelector('button');

      if (!username || !password) {
        errorSpan.textContent = '请输入用户名和密码';
        errorEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>登录中...';
      errorEl.classList.add('hidden');

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('admin_token', data.data.token);
          localStorage.setItem('admin_user', data.data.username);
          window.location.href = 'dashboard.html';
        } else {
          errorSpan.textContent = data.error || '登录失败';
          errorEl.classList.remove('hidden');
        }
      } catch (err) {
        errorSpan.textContent = '网络错误，请稍后重试';
        errorEl.classList.remove('hidden');
      }

      btn.disabled = false;
      btn.innerHTML = '<i class="fa fa-sign-in mr-2"></i>登录';
    });
  </script>
</body>
</html>
