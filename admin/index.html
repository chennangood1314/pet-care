<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>管理后台 - 宠物新手助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { background: #f0f2f5; min-height: 100vh; }
    input { font-size: 16px !important; } /* 防止 iOS 缩放 */
  </style>
</head>
<body class="flex items-center justify-center p-5">
  <div class="w-full max-w-sm sm:max-w-md md:max-w-lg">
    <!-- 头部 -->
    <div class="text-center mb-8">
      <div class="text-6xl mb-4">🐾</div>
      <h1 class="text-2xl font-bold text-gray-800">宠物助手</h1>
      <p class="text-gray-500 mt-1">管理后台</p>
    </div>

    <!-- 登录表单 -->
    <div class="bg-white rounded-2xl shadow-lg p-6">
      <form id="login-form" autocomplete="off" class="space-y-4">
        <div>
          <label class="block text-sm text-gray-600 mb-1.5">用户名</label>
          <input type="text" id="username" inputmode="text"
            class="w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:border-purple-500 focus:ring-2 focus:ring-purple-100 outline-none transition"
            placeholder="请输入用户名" autocomplete="off">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1.5">密码</label>
          <input type="password" id="password"
            class="w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:border-purple-500 focus:ring-2 focus:ring-purple-100 outline-none transition"
            placeholder="请输入密码" autocomplete="off">
        </div>
        <div id="error-msg" class="text-red-500 text-sm text-center hidden"></div>
        <button type="submit"
          class="w-full py-3.5 bg-purple-600 hover:bg-purple-700 active:bg-purple-800 text-white font-medium rounded-xl transition text-lg">
          登 录
        </button>
      </form>

      <!-- 快捷登录 -->
      <div class="mt-5 pt-4 border-t border-gray-100">
        <p class="text-center text-xs text-gray-400 mb-3">演示帐号一键填入</p>
        <button onclick="quickFill()"
          class="w-full py-2.5 border-2 border-purple-200 text-purple-600 rounded-xl font-medium hover:bg-purple-50 transition text-sm">
          <i class="fa fa-bolt mr-1"></i> admin / admin123
        </button>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">
      默认帐号: admin / admin123
    </p>
  </div>

  <script>
    function quickFill() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'admin123';
      document.getElementById('username').focus();
    }

    // 检查是否已登录
    (function() {
      var token = localStorage.getItem('admin_token');
      if (token) {
        fetch('/api/admin/products', {
          headers: { 'Authorization': 'Bearer ' + token }
        }).then(function(res) {
          if (res.ok) window.location.href = 'dashboard.html';
        });
      }
    })();

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var errorEl = document.getElementById('error-msg');
      var btn = this.querySelector('button');

      if (!username || !password) {
        errorEl.textContent = '请输入用户名和密码';
        errorEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中...';
      errorEl.classList.add('hidden');

      fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      }).then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.success) {
            localStorage.setItem('admin_token', data.data.token);
            localStorage.setItem('admin_user', data.data.username);
            window.location.href = 'dashboard.html';
          } else {
            errorEl.textContent = data.error || '登录失败';
            errorEl.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = '登 录';
          }
        }).catch(function() {
          errorEl.textContent = '网络错误，请稍后重试';
          errorEl.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = '登 录';
        });
    });
  </script>
</body>
</html>
